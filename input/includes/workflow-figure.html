<!-- The overview of key process flows, two ways, with a toggle. Both are drawn from the ArchiMate view "Overview of key process flows"
     (archimate/2.1.0/smart-ips-pilgrimage.archimate, id-59a6185ff9f2580db475ac98b7e1e854, built by archimate/build.py in the layout of
     input/images/workflow.png):
     - "As drawn": archimate/pretty.py, in the original figure's style; each pictogram is a role of scenarios/roles.json and opens
       its IG actor or persona, each numbered circle opens its journey moment;
     - "ArchiMate": the archimate-pages visualiser's drawing; each box opens its ArchiMate element (workflow.png if it cannot load). -->
<style>
.wf-fig .wf-pane{display:none}
.wf-fig input{position:absolute;opacity:0}
.wf-fig label{display:inline-block;padding:4px 12px;margin:0 4px 8px 0;border:1px solid #4472C4;border-radius:14px;color:#2F5597;cursor:pointer;font-size:.9em}
#wf-as-drawn:checked ~ .wf-pane-drawn, #wf-archimate:checked ~ .wf-pane-archimate{display:block}
#wf-as-drawn:checked ~ label[for=wf-as-drawn], #wf-archimate:checked ~ label[for=wf-archimate]{background:#4472C4;color:#fff}
</style>
<figure class="wf-fig" style="margin:0">
<input type="radio" name="wf-view" id="wf-as-drawn" checked="checked"/>
<input type="radio" name="wf-view" id="wf-archimate"/>
<label for="wf-as-drawn">As drawn</label>
<label for="wf-archimate">ArchiMate</label>
<div class="wf-pane wf-pane-drawn">{% include workflow-pretty.svg %}</div>
<div class="wf-pane wf-pane-archimate">
<object type="image/svg+xml" data="archimate/2.1.0/views/id-59a6185ff9f2580db475ac98b7e1e854.svg" style="width:100%;height:auto" aria-label="Overview of key process flows, ArchiMate view">
<img src="workflow.png" alt="Overview of key process flows" style="width:100%"/>
</object>
</div>
<figcaption style="font-size:.85em">Overview of key process flows, from this guide's <a href="en/smart-ips-pilgrimage/archimate/2.1.0/views/overview-of-key-process-flows/">ArchiMate model</a>. Each picture is a role of the guide (its actor or persona), and each numbered flow is a moment of <a href="pilgrim-journey.html">the pilgrim's journey</a>.</figcaption>
</figure>
