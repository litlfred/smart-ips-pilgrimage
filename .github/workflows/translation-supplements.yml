# Compile this IG's translation CodeSystem supplements
# (input/fsh/translations/<locale>.fsh) with SUSHI on every pull request that
# touches them. The steps are fhir-harness's (its translation-supplements.yml,
# from templates/ig-repo-site/), at the commit index.lock.json pins.
name: Translation supplements

on:
  pull_request:
    paths:
      - "input/fsh/**"
      - "sushi-config.yaml"
      - "index.config.json"
      - "index.lock.json"
      - ".github/workflows/translation-supplements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplements:
    uses: litlfred/fhir-harness/.github/workflows/translation-supplements.yml@3b583fd90778073a6bac853345e64867f6acbf88 # index.lock.json
